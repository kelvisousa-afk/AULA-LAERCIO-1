<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pesquisa de Satisfação - IFTO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-topo">
            <img src="ifto sla.jpg" alt="Logo IFTO">
        </div>
        <div class="header-text">
            <h1>Pesquisa de Satisfação</h1>
            <p>Instituto Federal do Tocantins</p>
        </div>
    </header>

    <main>
        <form action="" method="get" id="idformulario">
            
            <fieldset>
                <legend>1. IDENTIFICAÇÃO</legend>
                <div class="campo">
                    <label>Nome completo</label>
                    <input type="text" name="nomeCompleto" minlength="5" required>
                </div>
                <div class="campo-duplo">
                    <div class="campo">
                        <label>E-mail</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="campo">
                        <label>WhatsApp</label>
                        <input type="tel" name="whatsApp" required>
                    </div>
                </div>
                <div class="campo">
                    <label>Vínculo</label>
                    <div class="opcoes-flex">
                        <label><input type="radio" name="vinculo" value="discente"> Discente</label>
                        <label><input type="radio" name="vinculo" value="docente"> Docente</label>
                        <label><input type="radio" name="vinculo" value="tecnico"> Técnico</label>
                        <label><input type="radio" name="vinculo" value="externo"> Comunidade</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>3. EXPERIÊNCIA (1 a 5)</legend>
                <div class="item-avalia">
                    <label>Qualidade do Ensino</label>
                    <div class="notas-grid">
                        <label><input type="radio" name="ensino" value="1"> 1</label>
                        <label><input type="radio" name="ensino" value="2"> 2</label>
                        <label><input type="radio" name="ensino" value="3"> 3</label>
                        <label><input type="radio" name="ensino" value="4"> 4</label>
                        <label><input type="radio" name="ensino" value="5"> 5</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>4. INFRAESTRUTURA (1 a 5)</legend>
                <div class="item-avalia">
                    <label>Salas e Laboratórios</label>
                    <div class="notas-grid">
                        <label><input type="radio" name="salas" value="1"> 1</label>
                        <label><input type="radio" name="salas" value="2"> 2</label>
                        <label><input type="radio" name="salas" value="3"> 3</label>
                        <label><input type="radio" name="salas" value="4"> 4</label>
                        <label><input type="radio" name="salas" value="5"> 5</label>
                    </div>
                </div>
                <div class="item-avalia">
                    <label>Limpeza e Tecnologia</label>
                    <div class="notas-grid">
                        <label><input type="radio" name="limpeza" value="1"> 1</label>
                        <label><input type="radio" name="limpeza" value="2"> 2</label>
                        <label><input type="radio" name="limpeza" value="3"> 3</label>
                        <label><input type="radio" name="limpeza" value="4"> 4</label>
                        <label><input type="radio" name="limpeza" value="5"> 5</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>5. SERVIÇOS (1 a 5)</legend>
                <div class="item-avalia">
                    <label>Atendimento e Resolução de Problemas</label>
                    <div class="notas-grid">
                        <label><input type="radio" name="atendimento" value="1"> 1</label>
                        <label><input type="radio" name="atendimento" value="2"> 2</label>
                        <label><input type="radio" name="atendimento" value="3"> 3</label>
                        <label><input type="radio" name="atendimento" value="4"> 4</label>
                        <label><input type="radio" name="atendimento" value="5"> 5</label>
                    </div>
                </div>
            </fieldset>

            <fieldset>
                <legend>7. INOVAÇÃO (0 a 10)</legend>
                <label>Interesse em novos serviços:</label>
                <div class="notas-grid-10">
                    <label><input type="radio" name="inovacao" value="0"> 0</label>
                    <label><input type="radio" name="inovacao" value="1"> 1</label>
                    <label><input type="radio" name="inovacao" value="2"> 2</label>
                    <label><input type="radio" name="inovacao" value="3"> 3</label>
                    <label><input type="radio" name="inovacao" value="4"> 4</label>
                    <label><input type="radio" name="inovacao" value="5"> 5</label>
                    <label><input type="radio" name="inovacao" value="6"> 6</label>
                    <label><input type="radio" name="inovacao" value="7"> 7</label>
                    <label><input type="radio" name="inovacao" value="8"> 8</label>
                    <label><input type="radio" name="inovacao" value="9"> 9</label>
                    <label><input type="radio" name="inovacao" value="10"> 10</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>8. FEEDBACK FINAL</legend>
                <div class="campo">
                    <label>Pontos Fortes e Sugestões</label>
                    <textarea name="sugestoes" rows="4" placeholder="Escreva aqui..."></textarea>
                </div>
                <div class="campo">
                    <label>Recomendaria o IFTO?</label>
                    <select name="recomendacao">
                        <option value="">Selecione...</option>
                        <option value="sim">Sim</option>
                        <option value="nao">Não</option>
                    </select>
                </div>
            </fieldset>
            <fieldset>
                <legend>9. AVALIAÇÃO GERAL</legend>
                
                <div class="item-avalia">
                    <label>Nota geral para a instituição (0 a 10)</label>
                    <div class="notas-grid-10">
                        <label><input type="radio" name="notaGeral" value="0"> 0</label>
                        <label><input type="radio" name="notaGeral" value="1"> 1</label>
                        <label><input type="radio" name="notaGeral" value="2"> 2</label>
                        <label><input type="radio" name="notaGeral" value="3"> 3</label>
                        <label><input type="radio" name="notaGeral" value="4"> 4</label>
                        <label><input type="radio" name="notaGeral" value="5"> 5</label>
                        <label><input type="radio" name="notaGeral" value="6"> 6</label>
                        <label><input type="radio" name="notaGeral" value="7"> 7</label>
                        <label><input type="radio" name="notaGeral" value="8"> 8</label>
                        <label><input type="radio" name="notaGeral" value="9"> 9</label>
                        <label><input type="radio" name="notaGeral" value="10"> 10</label>
                    </div>
                </div>

                <div class="campo" style="margin-top: 20px;">
                    <label>Você recomendaria o IFTO a um amigo ou familiar?</label>
                    <select name="recomendacao" required>
                        <option value="" disabled selected>Selecione uma opção...</option>
                        <option value="sim">Sim, com certeza</option>
                        <option value="provavelmente">Provavelmente sim</option>
                        <option value="nao">Não recomendaria</option>
                    </select>
                </div>
            </fieldset>

            <button type="submit" class="btn-enviar">ENVIAR PESQUISA FINALIZADA</button>
        </form>
    </main>
</body>
</html>

            <button type="submit" class="btn-enviar">ENVIAR RESPOSTAS</button>
        </form>
    </main>
</body>
</html>
